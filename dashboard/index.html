<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headroom Compression Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0e11;--bg-card:#181b1f;--bg-hover:#22262c;--border:#2c3138;
  --text:#e0e3e8;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;
  --orange:#d29922;--red:#f85149;--purple:#bc8cff;--cyan:#39d2c0;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;max-width:1400px;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tabs a{background:var(--cyan);color:#fff;border:1px solid var(--cyan);padding:8px 20px;border-radius:6px;font-size:14px;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
header h1{font-size:22px;font-weight:600;color:var(--cyan)}
header h1 span{color:var(--text2);font-weight:400;font-size:14px;margin-left:8px}
.header-right{display:flex;align-items:center;gap:12px}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.config-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.config-bar label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:600;flex-shrink:0}
.config-bar input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:13px;font-family:inherit;flex:1;min-width:300px}
.config-bar input:focus{outline:none;border-color:var(--cyan)}
.config-bar button{background:var(--bg-card);color:var(--text2);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.config-bar button:hover{background:var(--bg-hover);color:var(--text)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center;transition:border-color .2s}
.kpi:hover{border-color:var(--cyan)}
.kpi-label{display:block;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.kpi-value{display:block;font-size:32px;font-weight:700}
.kpi-sub{display:block;font-size:11px;color:var(--text2);margin-top:4px}
.kpi-value.cyan{color:var(--cyan)}.kpi-value.green{color:var(--green)}.kpi-value.orange{color:var(--orange)}.kpi-value.purple{color:var(--purple)}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-box h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.chart-box canvas{max-height:220px}
.section{margin-bottom:24px}
h2.section-title{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text)}
table{width:100%;border-collapse:collapse;background:var(--bg-card);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
th{background:#14171a;color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;text-align:left;white-space:nowrap}
td{padding:10px 14px;font-size:13px;border-top:1px solid var(--border)}
tr:hover td{background:var(--bg-hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-green{background:rgba(63,185,80,.15);color:var(--green)}
.tag-orange{background:rgba(210,153,34,.15);color:var(--orange)}
.tag-blue{background:rgba(88,166,255,.15);color:var(--blue)}
.tag-purple{background:rgba(188,140,255,.15);color:var(--purple)}
.tag-cyan{background:rgba(57,210,192,.15);color:var(--cyan)}
.bar-bg{background:var(--border);border-radius:3px;height:8px;width:100%}
.bar-fill{height:8px;border-radius:3px;transition:width .5s}
.reason-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.reason-label{font-size:13px;color:var(--text);width:180px;flex-shrink:0}
.reason-count{font-size:13px;color:var(--text2);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.scroll-box{max-height:280px;overflow-y:auto;border-radius:10px}
.scroll-box table{border-radius:0}
.scroll-box thead{position:sticky;top:0;z-index:1}
.scroll-box::-webkit-scrollbar{width:6px}
.scroll-box::-webkit-scrollbar-track{background:var(--bg-card)}
.scroll-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.three-col{grid-template-columns:1fr}}
@media(max-width:600px){.kpi-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tabs"><a href="#" class="active">Compression</a></div>
<header>
  <h1>Headroom Compression Dashboard <span id="last-refresh"></span></h1>
  <div class="header-right">
    <span id="status-dot"></span>
    <span id="status-text" style="color:var(--text2);font-size:12px">connecting...</span>
    <button onclick="refresh()" style="background:var(--bg-card);color:var(--text2);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px">Refresh</button>
  </div>
</header>
<div class="config-bar">
  <label>Headroom URL</label>
  <input type="text" id="headroom-url" placeholder="https://headroom-service.apps.example.com">
  <button onclick="applyUrl()">Connect</button>
</div>

<div class="kpi-row">
  <div class="kpi"><span class="kpi-label">Total Requests</span><span class="kpi-value cyan" id="kpi-requests">--</span><span class="kpi-sub" id="kpi-compressed">-- compressed</span></div>
  <div class="kpi"><span class="kpi-label">Tokens Saved</span><span class="kpi-value green" id="kpi-tokens">--</span><span class="kpi-sub" id="kpi-tokens-sub">total input: --</span></div>
  <div class="kpi"><span class="kpi-label">Cost Saved</span><span class="kpi-value orange" id="kpi-cost">--</span><span class="kpi-sub" id="kpi-cost-sub">total spend: --</span></div>
  <div class="kpi"><span class="kpi-label">Compression Rate</span><span class="kpi-value purple" id="kpi-rate">--</span><span class="kpi-sub" id="kpi-best">best: --</span></div>
</div>

<div class="three-col">
  <div class="chart-box"><h2>Compression Breakdown</h2><canvas id="chart-breakdown"></canvas></div>
  <div class="chart-box"><h2>Token Savings</h2><div id="savings-bars"></div></div>
  <div class="chart-box"><h2>By User (Top 10)</h2><canvas id="chart-users"></canvas></div>
</div>

<div class="section">
  <h2 class="section-title">By User</h2>
  <div id="user-table"></div>
</div>

<div class="section">
  <h2 class="section-title">Recent Activity <span style="color:var(--text2);font-size:12px;font-weight:400">(live)</span></h2>
  <div class="scroll-box" id="activity-table"></div>
</div>

<script>
let BASE_URL=window.location.origin;
let breakdownChart=null,usersChart=null,refreshTimer=null;

(function(){
  const p=new URLSearchParams(window.location.search);
  if(p.get('url'))BASE_URL=p.get('url');
  document.getElementById('headroom-url').value=BASE_URL;
  refresh();refreshTimer=setInterval(refresh,10000);
})();

function applyUrl(){BASE_URL=document.getElementById('headroom-url').value.replace(/\/+$/,'');const u=new URL(window.location);u.searchParams.set('url',BASE_URL);window.history.replaceState({},'',u);refresh();}

async function refresh(){
  try{
    const d=await fetch(BASE_URL+'/stats').then(r=>r.json());
    updateAll(d);
    document.getElementById('status-dot').style.background='var(--green)';
    document.getElementById('status-text').textContent='connected';
    document.getElementById('last-refresh').textContent='· '+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('status-dot').style.background='var(--red)';
    document.getElementById('status-text').textContent='disconnected';
  }
}

function updateAll(d){
  const s=d.summary||{},c=s.compression||{},cost=s.cost||{},reqs=d.recent_requests||[];

  document.getElementById('kpi-requests').textContent=fmt(s.api_requests||0);
  document.getElementById('kpi-compressed').textContent=(c.requests_compressed||0)+' compressed';
  document.getElementById('kpi-tokens').textContent=fmtK(c.total_tokens_removed||0);

  const totalIn=reqs.reduce((a,r)=>a+(r.input_tokens_original||0),0);
  document.getElementById('kpi-tokens-sub').textContent='total input: '+fmtK(totalIn);
  document.getElementById('kpi-cost').textContent='$'+(cost.total_saved_usd||0).toFixed(4);
  document.getElementById('kpi-cost-sub').textContent='total spend: $'+(cost.without_headroom_usd||0).toFixed(2);
  document.getElementById('kpi-rate').textContent=(c.avg_compression_pct||0).toFixed(1)+'%';
  document.getElementById('kpi-best').textContent='best: '+(c.best_compression_pct||0).toFixed(1)+'%';

  // Breakdown donut
  const ctx1=document.getElementById('chart-breakdown').getContext('2d');
  if(breakdownChart)breakdownChart.destroy();
  const comp=c.requests_compressed||0,uncomp=(s.api_requests||0)-comp;
  breakdownChart=new Chart(ctx1,{type:'doughnut',data:{labels:['Compressed','Not compressed'],datasets:[{data:[comp,uncomp],backgroundColor:['#39d2c0','#2c3138'],borderWidth:1,hoverOffset:6}]},options:{responsive:true,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:'#8b949e',font:{size:12},padding:16,usePointStyle:true}}}}});

  // Savings bars
  const sb=document.getElementById('savings-bars');
  const totalSaved=c.total_tokens_removed||0;
  const totalOrig=totalIn||1;
  const savedPct=totalIn>0?Math.round(totalSaved/totalIn*100):0;
  const afterPct=100-savedPct;
  sb.innerHTML=`
    <div class="reason-row"><span class="reason-label">Original Input</span><div class="bar-bg"><div class="bar-fill" style="width:100%;background:var(--blue)"></div></div><span class="reason-count">${fmtK(totalIn)}</span></div>
    <div class="reason-row"><span class="reason-label">After Compression</span><div class="bar-bg"><div class="bar-fill" style="width:${afterPct}%;background:var(--green)"></div></div><span class="reason-count">${fmtK(totalIn-totalSaved)}</span></div>
    <div class="reason-row"><span class="reason-label">Tokens Saved</span><div class="bar-bg"><div class="bar-fill" style="width:${savedPct}%;background:var(--orange)"></div></div><span class="reason-count">${fmtK(totalSaved)}</span></div>
    <div class="reason-row"><span class="reason-label">Cost Without Headroom</span><div class="bar-bg"><div class="bar-fill" style="width:100%;background:var(--purple)"></div></div><span class="reason-count">$${(cost.without_headroom_usd||0).toFixed(2)}</span></div>
    <div class="reason-row"><span class="reason-label">Cost With Headroom</span><div class="bar-bg"><div class="bar-fill" style="width:${afterPct}%;background:var(--cyan)"></div></div><span class="reason-count">$${(cost.with_headroom_usd||0).toFixed(2)}</span></div>
  `;

  // Users donut
  const users={};
  reqs.forEach(r=>{const u=(r.tags||{})['user-id']||'anonymous';if(!users[u])users[u]={requests:0,tokens_in:0,saved:0,cost:0};users[u].requests++;users[u].tokens_in+=r.input_tokens_original||0;users[u].saved+=r.tokens_saved||0;users[u].cost+=(r.input_tokens_original||0)*15/1000000;});
  const ue=Object.entries(users).sort((a,b)=>b[1].cost-a[1].cost).slice(0,10);

  const ctx2=document.getElementById('chart-users').getContext('2d');
  if(usersChart)usersChart.destroy();
  const colors=['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39d2c0','#8b949e','#da3633','#57606a','#6e7681'];
  if(ue.length>0){
    usersChart=new Chart(ctx2,{type:'doughnut',data:{labels:ue.map(([n,d])=>n+' — $'+d.cost.toFixed(2)),datasets:[{data:ue.map(([,d])=>d.cost),backgroundColor:colors.slice(0,ue.length),borderWidth:1,hoverOffset:6}]},options:{responsive:true,cutout:'65%',plugins:{legend:{position:'right',labels:{color:'#8b949e',font:{size:11},padding:8,usePointStyle:true}}}}});
  }

  // User table
  const ut=document.getElementById('user-table');
  if(ue.length===0){ut.innerHTML='<div class="empty">No user data yet</div>';return;}
  ut.innerHTML=`<table><thead><tr><th>User</th><th class="num">Requests</th><th class="num">Input Tokens</th><th class="num">Tokens Saved</th><th class="num">Savings %</th><th class="num">Cost</th><th class="num">Saved</th></tr></thead><tbody>${ue.map(([name,d])=>{
    const pct=d.tokens_in>0?(d.saved/d.tokens_in*100).toFixed(1):'0.0';
    const savedCost=(d.saved*15/1000000).toFixed(4);
    const tc=name==='anonymous'?'tag-orange':'tag-green';
    return `<tr><td><span class="tag ${tc}">${name}</span></td><td class="num">${d.requests}</td><td class="num">${fmtK(d.tokens_in)}</td><td class="num" style="color:var(--green)">${fmtK(d.saved)}</td><td class="num" style="color:${parseFloat(pct)>0?'var(--green)':'var(--text2)'}">${pct}%</td><td class="num">$${d.cost.toFixed(4)}</td><td class="num" style="color:var(--orange)">$${savedCost}</td></tr>`;
  }).join('')}</tbody></table>`;

  // Activity table
  const at=document.getElementById('activity-table');
  const recent=reqs.slice().reverse();
  if(recent.length===0){at.innerHTML='<div class="empty">No activity yet</div>';return;}
  at.innerHTML=`<table><thead><tr><th>Time</th><th>User</th><th>Model</th><th class="num">Input</th><th class="num">Compressed</th><th class="num">Saved</th><th class="num">%</th></tr></thead><tbody>${recent.map(r=>{
    const t=new Date(r.timestamp);
    const time=t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const uid=(r.tags||{})['user-id']||'anon';
    const tc=uid==='anon'||uid==='anonymous'?'tag-orange':'tag-green';
    const saved=r.tokens_saved||0;
    const sc=saved>0?'var(--green)':'var(--text2)';
    return `<tr><td style="color:var(--text2)">${time}</td><td><span class="tag ${tc}">${uid}</span></td><td style="font-size:12px;color:var(--text2)">${r.model||'--'}</td><td class="num">${fmtK(r.input_tokens_original||0)}</td><td class="num">${fmtK(r.input_tokens_optimized||0)}</td><td class="num" style="color:${sc}">${saved>0?fmtK(saved):'0'}</td><td class="num" style="color:${sc}">${(r.savings_percent||0).toFixed(1)}%</td></tr>`;
  }).join('')}</tbody></table>`;
}

function fmt(n){return n==null?'--':Number(n).toLocaleString();}
function fmtK(n){if(n==null)return'--';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n);}
</script>
</body>
</html>
