apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom-gateway
  labels:
    app: headroom-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: headroom-gateway
  template:
    metadata:
      labels:
        app: headroom-gateway
    spec:
      containers:
        - name: headroom
          image: headroom-gateway:latest
          ports:
            - containerPort: 8787
              name: http
              protocol: TCP
          env:
            # Mode A (standalone): comment out TARGET_API_URL lines
            # Mode B (with BBR): uncomment and set your gateway URL
            # - name: ANTHROPIC_TARGET_API_URL
            #   value: "https://maas-gateway.company.com/llm/ext-claude-sonnet"
            - name: HEADROOM_STATELESS
              value: "false"
          envFrom:
            - configMapRef:
                name: headroom-gateway-config
                optional: true
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
            # For GPU-enabled deployments, uncomment:
            # limits:
            #   nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8787
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: headroom-gateway
  labels:
    app: headroom-gateway
spec:
  selector:
    app: headroom-gateway
  ports:
    - port: 8787
      targetPort: 8787
      protocol: TCP
      name: http
