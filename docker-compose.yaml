services:
  headroom:
    build:
      context: deploy/docker
      dockerfile: Dockerfile.local
    ports:
      - "8787:8787"
    entrypoint: ["headroom", "proxy", "--port", "8787", "--host", "0.0.0.0", "--backend", "litellm-vertex_ai", "--bedrock-region", "us-east5"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcloud/application_default_credentials.json
      VERTEX_PROJECT: "itpc-gcp-ai-eng-claude"
      VERTEX_LOCATION: "us-east5"
      VERTEXAI_PROJECT: "itpc-gcp-ai-eng-claude"
      VERTEXAI_LOCATION: "us-east5"
      GOOGLE_CLOUD_PROJECT: "itpc-gcp-ai-eng-claude"
      GCLOUD_PROJECT: "itpc-gcp-ai-eng-claude"
      HEADROOM_TELEMETRY: "off"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/opt/huggingface:ro
      - ~/.config/gcloud/application_default_credentials.json:/opt/gcloud/application_default_credentials.json:ro
      - headroom-data:/opt/headroom-data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  headroom-data:
