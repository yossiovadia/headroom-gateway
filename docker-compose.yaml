services:
  headroom:
    build:
      context: deploy/docker
      dockerfile: Dockerfile.local
    ports:
      - "8787:8787"
    environment:
      HEADROOM_TELEMETRY: "off"
      HEADROOM_STATELESS: "false"
      # Lower thresholds so compression triggers sooner
      HEADROOM_COMPRESSION_STABLE_AFTER_TURN: "2"
      HEADROOM_STALE_READ_COMPRESS_AFTER_TURNS: "2"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/opt/huggingface:ro
      - headroom-data:/opt/headroom-data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  headroom-data:
